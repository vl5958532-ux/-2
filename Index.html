<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Затишний Клікер М'яких Іграшок</title>
    <!-- Підключення шрифту з милими заокругленнями -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3d7d7;
            --container-bg: #fff5f5;
            --accent-pink: #e0828a;
            --accent-dark: #7a3e43;
            --border-color: #b5636b;
            --gold: #f4c430;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            /* Візерунок у вишках/вишеньках як на референсах */
            background-image: radial-gradient(#e5a4a9 15%, transparent 16%), radial-gradient(#e5a4a9 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: 'Fredoka', sans-serif;
            color: var(--accent-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--container-bg);
            border: 4px dashed var(--border-color);
            border-radius: 30px;
            margin: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(122, 62, 67, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            color: var(--accent-dark);
            text-shadow: 1px 1px 0px #ffdede;
        }

        .score-board {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 25px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
